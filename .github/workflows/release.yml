name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vanilla-os/pico:latest
      volumes:
        - /proc:/proc
        - /:/run/host
      options: --privileged -it
    permissions:
      contents: read

    steps:
        - uses: actions/checkout@v4
  
        - name: Install build dependencies
          run: |
            apt-get update
            apt-get build-dep -y .
            apt-get install -y devscripts
            uscan --verbose --force-download --download-current-version
  
        - name: Build .deb package
          run: |
              dpkg-buildpackage
              mv ../plasma-welcome_*.deb plasma-welcome.deb
  
        - name: Calculate and Save Checksums
          run: |
            sha256sum plasma-welcome.deb >> checksums.txt
  
        - uses: actions/upload-artifact@v4
          with:
            name: first-setup
            path: |
                checksums.txt
                plasma-welcome.deb
  release:
    runs-on: ubuntu-latest
    needs: build-artifacts
    permissions:
      contents: write # to create and upload assets to releases
      attestations: write # to upload assets attestation for build provenance
      id-token: write # grant additional permission to attestation action to mint the OIDC token permission

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: plasma-welcome

      - name: Create Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes plasma-welcome.deb checksums.txt
      
      - name: Attest Release Files
        id: attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'plasma-welcome.deb, checksums.txt'
