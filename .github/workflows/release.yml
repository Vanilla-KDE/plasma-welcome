name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-artifacts:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/vanilla-os/pico:latest
      volumes:
        - /proc:/proc
        - /:/run/host
      options: --privileged -it

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get build-dep -y .
  
      - name: Build .deb package
        run: |
          dpkg-buildpackage -b -us -uc
          mv ../plasma-welcome_*.deb plasma-welcome-${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: plasma-welcome-${{ matrix.arch }}.deb

  release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum plasma-welcome-*.deb > checksums.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            plasma-welcome-*.deb checksums.txt

      - name: Attest Release Files
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            plasma-welcome-*.deb
            checksums.txt